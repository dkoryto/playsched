name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: flake8 . --max-line-length=160 --exclude=venv,.venv,__pycache__,.git

      - name: Generate test secrets
        run: echo "TOKEN_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")" >> "$GITHUB_ENV"

      - name: Run tests
        env:
          SECRET_KEY: "ci-secret-key"
          SPOTIPY_CLIENT_ID: "test-client-id"
          SPOTIPY_CLIENT_SECRET: "test-client-secret"
          SPOTIPY_REDIRECT_URI: "http://localhost:9093/callback"
          SCHEDULE_DB_FILE: "test.db"
        run: pytest tests/ -v
